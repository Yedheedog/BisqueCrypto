name: Android ARM64 portability probe

on:
  push:
    branches: [android-arm64-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ zlib1g-dev
      - name: Prepare isolated Linux-compatible source copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          src = Path("BQ_Crypto")
          dst = Path("/tmp/bisque-port-probe")
          shutil.copytree(src, dst)
          shutil.copy2(Path("BQ_Crypto/portable_api.cpp"), dst / "portable_api.cpp")

          header = dst / "BisqueCrypto.h"
          data = header.read_bytes()
          old = b"#include <Windows.h>"
          if old not in data:
              raise SystemExit("Expected Windows.h include not found")
          data = data.replace(old, b"#include <cstdint>\n#include <cstdlib>\n#include <cstring>\n#include <cctype>")
          header.write_bytes(data)

          cpp = dst / "BisqueCrypto.cpp"
          data = cpp.read_bytes().replace(b"#include <intrin.h>", b"")
          marker = b"int MD159::DecryptMD40S("
          pos = data.find(marker)
          if pos < 0:
              raise SystemExit("Expected x86-only DecryptMD40S routine not found")
          body_start = data.find(b"{", pos)
          if body_start < 0:
              raise SystemExit("DecryptMD40S function body not found")
          depth = 0
          body_end = None
          for index in range(body_start, len(data)):
              if data[index:index + 1] == b"{":
                  depth += 1
              elif data[index:index + 1] == b"}":
                  depth -= 1
                  if depth == 0:
                      body_end = index + 1
                      break
          if body_end is None:
              raise SystemExit("Could not find end of DecryptMD40S function")
          data = data[:pos] + data[body_end:]

          old = (b"                v69 = &v62[4 * BYTE1(v66)];\n"
                 b"                v70 = &v62[4 * (uint8)v66];\n"
                 b"                v71 = *((DWORD*)v67 + 256);\n"
                 b"                LODWORD(v69) = *((DWORD*)v69 + 512);\n"
                 b"                LODWORD(v70) = *((DWORD*)v70 + 768);")
          new = (b"                uint32 v69_value = *((DWORD*)(&v62[4 * BYTE1(v66)]) + 512);\n"
                 b"                uint32 v70_value = *((DWORD*)(&v62[4 * (uint8)v66]) + 768);\n"
                 b"                v71 = *((DWORD*)v67 + 256);")
          if old not in data:
              raise SystemExit("Expected decompiler pseudo-pointer sequence not found")
          data = data.replace(old, new)
          old_expr = b"v40 = (((v71 + v68) ^ (uint32)v69) + (DWORD)v70) ^ v63 ^ v64;"
          new_expr = b"v40 = (((v71 + v68) ^ v69_value) + v70_value) ^ v63 ^ v64;"
          if old_expr not in data:
              raise SystemExit("Expected pseudo-pointer expression not found")
          data = data.replace(old_expr, new_expr)
          cpp.write_bytes(data)
          PY
      - name: Create round-trip probe
        run: |
          cat > /tmp/bisque-port-probe/probe.cpp <<'CPP'
          #include "BisqueCrypto.h"
          #include <iostream>
          #include <string>
          #include <vector>
          #include <cstring>
          #include <algorithm>

          int main() {
              const char* key = "vuyWQSjlknpJF54ib36txVse";
              const std::string plain = "Bonjour MD159! Android ARM64 portability probe.";
              const size_t padded = (plain.size() + 15) & ~size_t(15);
              std::vector<uint8_t> input(padded, 0);
              std::memcpy(input.data(), plain.data(), plain.size());

              MD159 crypto;
              const auto key_status = crypto.InitializeKey(key, std::strlen(key));
              if (key_status < 0) {
                  std::cerr << "InitializeKey failed: " << key_status << "\n";
                  return 1;
              }

              std::vector<uint8_t> encrypted, decrypted;
              crypto.Encrypt(input.data(), static_cast<uint32_t>(input.size()), encrypted);
              crypto.Decrypt(encrypted.data(), static_cast<uint32_t>(encrypted.size()), decrypted);
              if (decrypted.size() != input.size() ||
                  !std::equal(input.begin(), input.end(), decrypted.begin())) {
                  std::cerr << "MD159 round-trip mismatch\n";
                  return 2;
              }

              const auto encoded = RB64Encode(encrypted.data(), static_cast<uint32_t>(encrypted.size()));
              const auto decoded = RB64Decode(encoded.c_str());
              if (decoded != encrypted) {
                  std::cerr << "R-Base64 round-trip mismatch\n";
                  return 3;
              }

              std::cout << "MD159 round-trip: PASS\n";
              std::cout << "R-Base64 round-trip: PASS\n";
              std::cout << "Ciphertext fixture: " << encoded << "\n";
              return 0;
          }
          CPP
      - name: Compile and run host portability probe
        run: |
          g++ -std=c++17 -O2 -D__fastcall= \
            -I/tmp/bisque-port-probe \
            /tmp/bisque-port-probe/BisqueCrypto.cpp \
            /tmp/bisque-port-probe/BisqueB64.cpp \
            /tmp/bisque-port-probe/probe.cpp \
            -lz -o /tmp/bisque-port-probe/probe
          /tmp/bisque-port-probe/probe

      - name: Build and test portable C ABI with Python ctypes
        run: |
          g++ -std=c++17 -O2 -fPIC -shared -D__fastcall= \
            -I/tmp/bisque-port-probe \
            /tmp/bisque-port-probe/BisqueCrypto.cpp \
            /tmp/bisque-port-probe/BisqueB64.cpp \
            /tmp/bisque-port-probe/portable_api.cpp \
            -lz -o /tmp/bisque-port-probe/libbisquecrypto-host.so
          python3 tests/portable_ctypes_smoke.py /tmp/bisque-port-probe/libbisquecrypto-host.so
      - name: Install Android NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK candidate: $SDK"
          SDKMANAGER="$(find "$SDK" /usr/local/lib/android /opt -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; available Android SDK directories:"
            ls -la /usr/local/lib/android /usr/local/lib/android/sdk /opt/android-sdk 2>/dev/null || true
            find /usr/local/lib /opt -type f -name sdkmanager -print 2>/dev/null | head -20
            exit 1
          fi
          SDK="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "Using SDK manager: $SDKMANAGER"
          echo "Resolved Android SDK: $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
      - name: Cross-compile ARM64 Android shared library
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          "$TOOLCHAIN/bin/clang++" \
            --target=aarch64-linux-android24 \
            --sysroot="$TOOLCHAIN/sysroot" \
            -std=c++17 -O2 -fPIC -shared -D__fastcall= \
            -I/tmp/bisque-port-probe \
            /tmp/bisque-port-probe/BisqueCrypto.cpp \
            /tmp/bisque-port-probe/BisqueB64.cpp \
            /tmp/bisque-port-probe/portable_api.cpp \
            -lz -o /tmp/bisque-port-probe/libbisquecrypto.so
          file /tmp/bisque-port-probe/libbisquecrypto.so
          readelf -h /tmp/bisque-port-probe/libbisquecrypto.so | grep -E "Class:|Machine:"

      - name: Upload ARM64 Android library
        uses: actions/upload-artifact@v4
        with:
          name: libbisquecrypto-android-arm64
          path: /tmp/bisque-port-probe/libbisquecrypto.so
          if-no-files-found: error

  windows-dll-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install zlib
        shell: pwsh
        run: |
          $baseline = (Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/vcpkg/commits/master").sha
          if (-not $baseline) { throw "Could not resolve the vcpkg registry baseline" }
          @{ "builtin-baseline" = $baseline; dependencies = @("zlib") } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 vcpkg.json
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows
      - name: Prepare source copy for MSVC
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import os
          import shutil

          src = Path("BQ_Crypto")
          dst = Path(os.environ["TEMP"]) / "bisque-windows-probe"
          shutil.copytree(src, dst)
          cpp = dst / "BisqueCrypto.cpp"
          data = cpp.read_bytes().replace(b"\r\n", b"\n")
          old = (b"                v69 = &v62[4 * BYTE1(v66)];\n"
                 b"                v70 = &v62[4 * (uint8)v66];\n"
                 b"                v71 = *((DWORD*)v67 + 256);\n"
                 b"                LODWORD(v69) = *((DWORD*)v69 + 512);\n"
                 b"                LODWORD(v70) = *((DWORD*)v70 + 768);")
          new = (b"                uint32 v69_value = *((DWORD*)(&v62[4 * BYTE1(v66)]) + 512);\n"
                 b"                uint32 v70_value = *((DWORD*)(&v62[4 * (uint8)v66]) + 768);\n"
                 b"                v71 = *((DWORD*)v67 + 256);")
          if old not in data:
              raise SystemExit("Expected decompiler pseudo-pointer sequence not found")
          data = data.replace(old, new)
          old_expr = b"v40 = (((v71 + v68) ^ (uint32)v69) + (DWORD)v70) ^ v63 ^ v64;"
          new_expr = b"v40 = (((v71 + v68) ^ v69_value) + v70_value) ^ v63 ^ v64;"
          if old_expr not in data:
              raise SystemExit("Expected pseudo-pointer expression not found")
          cpp.write_bytes(data.replace(old_expr, new_expr))
          '@ | Set-Content -Encoding utf8 prepare_windows.py
          python prepare_windows.py
      - name: Build portable Windows DLL
        shell: pwsh
        run: |
          $src = Join-Path $env:TEMP "bisque-windows-probe"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          $zlibLib = Get-ChildItem -Path $installed -Recurse -File -Filter "zlib.lib" | Select-Object -First 1
          $zlibHeader = Get-ChildItem -Path $installed -Recurse -File -Filter "zlib.h" | Select-Object -First 1
          if (-not $zlibLib -or -not $zlibHeader) { throw "Could not locate installed zlib.lib and zlib.h under $installed" }
          $libDir = Split-Path $zlibLib.FullName
          $includeDir = Split-Path $zlibHeader.FullName
          $out = Join-Path $env:TEMP "portable-bisque.dll"
          Write-Host "Using zlib library: $($zlibLib.FullName)"
          Write-Host "Using zlib headers: $includeDir"
          cl /nologo /std:c++17 /EHsc /MD /LD "/I$includeDir" "$src\BisqueCrypto.cpp" "$src\BisqueB64.cpp" "$src\portable_api.cpp" /link "/LIBPATH:$libDir" zlib.lib "/OUT:$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PORTABLE_DLL=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          $zlibDll = Get-ChildItem -Path $installed -Recurse -File -Filter "zlib1.dll" | Select-Object -First 1
          if ($zlibDll) { $env:PATH = "$(Split-Path $zlibDll.FullName);$env:PATH" }
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download exact legacy DLL and compare outputs
        shell: pwsh
        run: |
          $legacy = Join-Path $env:TEMP "BisquseDLL.dll"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/techwhiz1/BisqueCrypto/main/BisquseDLL/BisquseDLL.dll" -OutFile $legacy
          python tests/compare_original_dll.py $legacy $env:PORTABLE_DLL

